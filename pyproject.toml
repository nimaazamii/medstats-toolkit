[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medstats-toolkit"
version = "0.1.0"
description = "Statistics for medical data: hypothesis tests, binomial confidence intervals, multiple-testing correction, Bayesian diagnostic reasoning and Monte Carlo simulation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nima Azami" }]
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = ["biostatistics", "hypothesis-testing", "bayesian", "monte-carlo"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
